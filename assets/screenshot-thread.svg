<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" role="img" aria-label="Thread to Self thread screen preview">
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e8"/>
      <stop offset="100%" stop-color="#efe7d6"/>
    </linearGradient>
  </defs>
  <rect width="380" height="780" fill="url(#screenBg)"/>
  <rect x="0" y="0" width="380" height="86" fill="#ffffff" opacity="0.95"/>
  <text x="190" y="54" text-anchor="middle" fill="#1e2a4a" font-size="28" font-family="Helvetica, Arial, sans-serif">Thread to Self</text>

  <g fill="#8a8f99" font-size="18" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="190" y="126">Today</text>
  </g>

  <g>
    <rect x="24" y="148" width="332" height="78" rx="18" fill="#ffffff"/>
    <text x="40" y="180" fill="#344055" font-size="20" font-family="Helvetica, Arial, sans-serif">Call mom tomorrow.</text>
    <text x="40" y="205" fill="#7a8290" font-size="15" font-family="Helvetica, Arial, sans-serif">9:42 AM</text>
  </g>

  <g>
    <rect x="24" y="246" width="332" height="96" rx="18" fill="#ffffff"/>
    <text x="40" y="278" fill="#344055" font-size="20" font-family="Helvetica, Arial, sans-serif">The hard thing became</text>
    <text x="40" y="304" fill="#344055" font-size="20" font-family="Helvetica, Arial, sans-serif">easy once I started.</text>
    <text x="40" y="328" fill="#7a8290" font-size="15" font-family="Helvetica, Arial, sans-serif">11:06 AM</text>
  </g>

  <g>
    <rect x="24" y="362" width="332" height="116" rx="18" fill="#ffffff"/>
    <text x="40" y="394" fill="#344055" font-size="20" font-family="Helvetica, Arial, sans-serif">Buy coffee filters,</text>
    <text x="40" y="420" fill="#344055" font-size="20" font-family="Helvetica, Arial, sans-serif">book dentist checkup,</text>
    <text x="40" y="446" fill="#344055" font-size="20" font-family="Helvetica, Arial, sans-serif">and pack gym shoes.</text>
    <text x="40" y="468" fill="#7a8290" font-size="15" font-family="Helvetica, Arial, sans-serif">2:13 PM</text>
  </g>

  <g>
    <rect x="24" y="498" width="332" height="88" rx="18" fill="#ffffff"/>
    <text x="40" y="530" fill="#344055" font-size="20" font-family="Helvetica, Arial, sans-serif">Remember this sunset.</text>
    <text x="40" y="556" fill="#7a8290" font-size="15" font-family="Helvetica, Arial, sans-serif">7:51 PM</text>
  </g>

  <rect x="24" y="708" width="332" height="48" rx="24" fill="#ffffff"/>
